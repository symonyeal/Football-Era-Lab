name: Game checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-analytics.txt
      - name: Check the shared JavaScript engine and draft
        run: node --test tests/engine/*.test.mjs
      - name: Check pipeline rules without network calls
        run: python -m unittest discover -s tests -p test_pipeline.py -v
      - name: Check identity batches do not share the wrong cached facts
        run: python -m unittest discover -s tests -p test_wikidata.py -v
      - name: Check calibration against independent synthetic counts
        run: python -m pytest tests/test_calibration.py -q -p no:cacheprovider
      - name: Execute the notebook with the JavaScript engine
        run: python -c "import nbformat; from nbclient import NotebookClient; n=nbformat.read('Football Era Lab.ipynb',as_version=4); NotebookClient(n,timeout=180,kernel_name='python3').execute()"
      - name: Install browser check tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save playwright@1.64.0
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check desktop, tablet, mobile and reduced-motion gameplay
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/football-http.log" 2>&1 &
          node tests/browser/acceptance.cjs --playwright "$RUNNER_TEMP/browser/node_modules/playwright" --output "$RUNNER_TEMP/football-browser-results"
      - name: Preserve browser check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: ${{ runner.temp }}/football-browser-results
